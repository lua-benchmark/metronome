# net/http_external/nginx.conf
#
# OpenResty companion for metronome's mod_http_upload_external. It terminates
# the external file-transfer endpoints that the XMPP side addresses through
# http_file_external_url and dispatches each request to handler.lua.

worker_processes auto;
error_log logs/error.log info;

events {
    worker_connections 1024;
}

http {
    lua_package_path "$prefix/net/http_external/?.lua;;";

    init_by_lua_block {
        require "cjson"
        require "resty.session"
        require "xmlua"
    }

    server {
        listen 8080;
        server_name _;

        location /ext/upload {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/admin {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/share {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/status {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/preview {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/login {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/go {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/maintenance {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/error {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/reports {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/console {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/signin {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/gallery {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/import {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }

        location /ext/roster {
            content_by_lua_file /home/lucas/Desktop/Lua-repos/metronome/net/http_external/handler.lua;
        }
    }
}
